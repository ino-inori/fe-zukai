<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SQLクイズ | 触って理解する基本情報</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="sql.css?v=2">
<script src="../js/common.js"></script>
</head>
<body>
<header class="site-header"><div class="inner">
  <a class="brand" href="../index.html">触って理解する<span>基本情報</span></a>
  <div class="spacer"></div>
  <button class="icon-btn" id="theme-toggle" type="button">☾ ダーク</button>
</div></header>

<main>
  <div class="crumb"><a href="../index.html">トップ</a> › SQLクイズ</div>
  <h1 class="page-title">SQLクイズ</h1>
  <p class="page-lead">元の表と「欲しい出力結果」を見て、SQL を書いて答えます。入力した SQL はブラウザの中の SQLite（データベースソフト）で実際に動かして採点します。</p>

  <div class="sq-nav">
    <button class="btn" id="prev-btn" type="button">← 前へ</button>
    <select id="problem-select" aria-label="問題を選ぶ"></select>
    <button class="btn" id="next-nav-btn" type="button">次へ →</button>
  </div>

  <div id="loading" class="card">読み込み中…</div>
  <div id="load-error" class="card sq-error" hidden></div>

  <article id="quiz" hidden>
    <section class="card">
      <div class="sq-meta"><span id="q-num" class="sq-qnum"></span><span id="q-cat" class="badge ready"></span><span id="q-diff" class="freq"></span></div>
      <p id="q-text" class="sq-question"></p>
    </section>

    <h2>元のテーブル</h2>
    <div id="source-tables" class="sq-tables"></div>

    <h2 id="expected-title">欲しい出力結果</h2>
    <div id="expected" class="sq-tables"></div>
    <p class="note" id="order-note"></p>

    <h2>SQL を入力</h2>
    <textarea id="sql-input" class="sq-input" rows="4" spellcheck="false" autocomplete="off" autocapitalize="off"
      placeholder="例）SELECT 列名 FROM 表名;" aria-describedby="input-help"></textarea>
    <p class="note" id="input-help"><kbd>Enter</kbd> で回答、<kbd>Shift</kbd> + <kbd>Enter</kbd> で改行。最後に <code>;</code>（セミコロン）を付けます。</p>
    <div class="btn-row">
      <button class="btn primary" id="answer-btn" type="button">回答</button>
      <button class="btn" id="hint-btn" type="button">ヒント</button>
      <button class="btn" id="show-btn" type="button">答えを見る</button>
      <button class="btn primary" id="next-btn" type="button" hidden>次の問題へ →</button>
    </div>

    <div id="hint" class="point" hidden></div>
    <div id="result" aria-live="polite"></div>
    <div id="answer-box" class="card" hidden></div>
  </article>
</main>

<footer class="site-footer">自分用の学習サイト。問題と表データはすべてオリジナルです。SQLite と試験の標準SQLで違う点は解説に注記しています。</footer>

<script src="vendor/sql.js-1.10.3/sql-wasm.js"></script>
<script src="js/grader.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
